# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name vip.tokencompass.info www.vip.tokencompass.info;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vip.tokencompass.info www.vip.tokencompass.info;

    # SSL configuration
    ssl_certificate /etc/ssl/certs/vip.tokencompass.info.crt;
    ssl_certificate_key /etc/ssl/private/vip.tokencompass.info.key;
    ssl_trusted_certificate /etc/ssl/certs/ca_vip.tokencompass.info.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve the SPA routing fix
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Handle SPA routing
        # If the requested file is not found, serve index.html
        try_files $uri $uri/ /index.html;
    }

    # Static file caching for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Health check endpoint
    location /health {
        return 200;
    }

    # Optional: Block access to hidden files (e.g., .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
