version: '3'
services:
  node-api:
    build:
      context: .  # Root directory
      dockerfile: Dockerfile.server  # Path to the server Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./server:/usr/src/app  # To enable easy development

  react-app:
    build:
      context: .  # Root directory
      dockerfile: Dockerfile.react  # Path to the React Dockerfile
    ports:
      - "80:80"
    depends_on:
      - node-api  # Ensure the API is started before the React app