version: '3'
services:
  node-api:
    build:
      context: .  # Build context set to root directory
      dockerfile: Dockerfile.server  # Correct reference to the Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./server:/usr/src/app  # To enable development changes

  react-app:
    build:
      context: .  # Same root context
      dockerfile: Dockerfile.react
    ports:
      - "80:80"
    depends_on:
      - node-api  # API starts first